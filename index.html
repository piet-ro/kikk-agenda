/* Layout: KIKK-bingo look. Black ground, white type and hairline grid; venue colour only as accent. One scroll of three days. */
:root{
  --bg:#ffffff; --surface:#ffffff; --ink:#000000; --muted:#6b6b6b; --line:#000000; --dim:#d4d4d4; --chip:#efefef;
  --bourse:#2f4fe0; --theatre:#e5401f; --delta:#0a9a72; --other:#8a8a8a;
  --on-venue:#ffffff; --on-ink-muted:#b3b3b3;
  --display:"Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ppm:2.4px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.3;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}

.hero{padding-block:28px 6px}
.hero h1{margin:0;font-weight:800;font-size:clamp(64px,22vw,112px);line-height:.82;letter-spacing:-.055em;font-variation-settings:"wdth" 100}
.hero .where{margin-top:14px;color:var(--muted);font-size:17px;font-weight:500;letter-spacing:-.01em}
.sync{margin-top:6px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.sync a{color:var(--ink)}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 12px;
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));border-bottom:1.5px solid var(--line)}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;border:1.5px solid var(--line);border-radius:999px;padding:2px;flex:1 1 160px;min-width:0}
.seg button{flex:1 1 auto;border:0;background:transparent;border-radius:999px;padding:7px 6px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink);white-space:nowrap;letter-spacing:-.01em}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.count{font-family:var(--mono);font-size:11px;font-weight:500;margin-left:5px}
.daynav{display:grid;grid-template-columns:repeat(3,1fr);margin-top:10px;border:1.5px solid var(--line)}
.daynav button{border:0;border-left:1.5px solid var(--line);background:transparent;padding:6px 0 4px;cursor:pointer;color:var(--muted);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em}
.daynav button:first-child{border-left:0}
.daynav button b{display:block;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.04em;color:var(--ink);line-height:1}
.daynav button[aria-current="true"]{background:var(--ink);color:var(--on-ink-muted)}
.daynav button[aria-current="true"] b{color:var(--bg)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}

.day{padding-top:28px;scroll-margin-top:var(--hdr,200px)}
.dayhead{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.dayhead h2{margin:0;font-size:48px;font-weight:800;letter-spacing:-.055em;line-height:.9}
.dayhead .meta{font-family:var(--mono);font-size:11px;color:var(--muted)}
.empty{border:1.5px dashed var(--dim);padding:18px;color:var(--muted);font-size:14px}

/* Blocks mode: a single bordered grid like the bingo card */
.list{display:flex;flex-direction:column;border-top:1.5px solid var(--line)}
.slot{display:grid;grid-template-columns:52px 1fr;border-bottom:1.5px solid var(--line)}
.slot .t{font-family:var(--mono);font-size:12px;padding:10px 0 0;color:var(--ink);font-variant-numeric:tabular-nums;border-right:1.5px solid var(--line)}
.slot .cards{display:flex;flex-direction:column;min-width:0}
.card{position:relative;display:block;width:100%;text-align:left;cursor:pointer;background:var(--surface);
  padding:9px 46px 9px 12px;height:78px;overflow:hidden;border-top:1.5px solid var(--dim)}
.slot .cards .card:first-child{border-top:0}
.card .when{font-family:var(--mono);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.card .when i{width:8px;height:8px;border-radius:50%;background:var(--v);flex:none}
.card .ttl{font-weight:600;font-size:15px;line-height:1.15;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.card .where{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.on{background:var(--ink);color:var(--bg);box-shadow:inset 6px 0 0 var(--v)}
.card.on .when,.card.on .where{color:var(--on-ink-muted)}
.pick{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;
  border:1.5px solid var(--ink);background:transparent;display:grid;place-items:center;cursor:pointer;padding:0;color:var(--ink)}
.card.on .pick{border-color:var(--bg);background:var(--bg);color:var(--ink)}
.pick svg{width:14px;height:14px}
.pick:disabled{cursor:default}
.btn-pick:disabled{cursor:default;opacity:.6}
.clash{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:0 5px;border-radius:999px;background:var(--theatre);color:var(--on-venue)}

/* To-scale mode */
.tl{position:relative;margin-left:44px}
.tl .hr{position:absolute;left:-44px;right:0;border-top:1px solid var(--dim);font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.tl .hr span{position:absolute;top:-7px;left:0;background:var(--bg);padding-right:6px}
.tl .ev{position:absolute;border:1.5px solid var(--ink);padding:3px 5px;border-radius:0;overflow:hidden;text-align:left;cursor:pointer;
  background:var(--surface);font-size:11.5px;line-height:1.12;box-shadow:inset 0 3px 0 var(--v)}
.tl .ev .when{font-family:var(--mono);font-size:9.5px;color:var(--muted);padding-top:2px}
.tl .ev .ttl{font-weight:600;overflow-wrap:break-word;hyphens:auto;letter-spacing:-.01em}
.tl .ev.on{background:var(--ink);color:var(--bg);box-shadow:inset 0 5px 0 var(--v)}
.tl .ev.on .when{color:var(--on-ink-muted)}
.tl .ev.tiny{padding-block:1px}
.tl .ev.tiny .when{display:none}
.now{position:absolute;left:-44px;right:0;border-top:2px solid var(--theatre);z-index:2;pointer-events:none}
.now span{position:absolute;top:-9px;left:0;background:var(--theatre);color:var(--on-venue);font-family:var(--mono);font-size:9.5px;padding:1px 4px}

/* Detail sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-top:1.5px solid var(--line);
  padding:20px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto}
.sheet .inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.sheet .tag{align-self:flex-start;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;padding:2px 8px;border-radius:999px;background:var(--v);color:var(--on-venue)}
.sheet h3{margin:0;font-size:28px;font-weight:800;line-height:1;letter-spacing:-.04em;text-wrap:balance}
.sheet .sub{color:var(--muted);font-size:14.5px}
.sheet .row{font-family:var(--mono);font-size:12px;color:var(--ink)}
.sheet .actions{display:flex;gap:8px;margin-top:8px}
.sheet .actions > *{flex:1;text-align:center;border-radius:999px;padding:12px;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;border:1.5px solid var(--ink)}
.btn-pick{background:var(--ink);color:var(--bg)}
.btn-pick.on{background:transparent;color:var(--ink)}
.btn-link{color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
footer{margin-top:32px;font-size:12px;color:var(--muted)}
footer a{color:inherit}
</style>

const toMin = s => { const [h,m] = s.split(":").map(Number); return h*60+m; };
const fmt = m => { m = ((m % 1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); };
const venueOf = loc => /bourse/i.test(loc) ? "bourse" : /th[ée][âa]tre/i.test(loc) ? "theatre" : /delta/i.test(loc) ? "delta" : "other";

// We only reach Namur on Thu 22 in the afternoon: festival events starting before this are hidden, whatever the source data says.
const ARRIVAL = {day:"2026-10-22", from:toMin("15:00")};
const EVENTS = [];
for (const d of DAYS) for (const r of RAW[d.id]) {
  const [tag,s,e,title,sub,loc,path] = r;
  const start = toMin(s); let end = e ? toMin(e) : start + 60;
  if (end <= start) end += 1440;
  if (d.id === ARRIVAL.day && start < ARRIVAL.from) continue;
  EVENTS.push({id:path, day:d.id, tag, start, end, noEnd:!e, title, sub, loc, venue:venueOf(loc), url:"https://kikkfestival.be"+path});
}
// Group plan: always in My picks, cannot be removed. [id, day, tag, start, end, title, description, location]
const FIXED = [
  ["fixed-bus","2026-10-22","TRAVEL","10:30","10:45","Gather for bus","","Flixbus station Utrecht, in front of the NH hotel"],
  ["fixed-dinner","2026-10-22","DINNER","19:30","21:30","Dinner","Assemble at the hotel at 19:00 to walk there together","Restaurant Balthazar, Namur"]
];
for (const [id,day,tag,s,e,title,sub,loc] of FIXED) {
  EVENTS.push({id, day, tag, start:toMin(s), end:toMin(e), fixed:true, title, sub, loc, venue:venueOf(loc),
    url:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(loc), urlLabel:"Map ↗"});
}
const isFixed = id => EVENTS.some(e => e.id===id && e.fixed);

const store = {
  get(k,f){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; }catch(_){ return f; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(_){} }
};
const state = {
  picks: new Set(store.get("kikk.picks", [])),
  view: store.get("kikk.view", "all"),
  scale: store.get("kikk.scale", "blocks")
};
for (const id of state.picks) if (!EVENTS.some(e => e.id===id)) state.picks.delete(id);
for (const e of EVENTS) if (e.fixed) state.picks.add(e.id);
const save = () => { store.set("kikk.picks",[...state.picks]); store.set("kikk.view",state.view); store.set("kikk.scale",state.scale); };

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const check = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
const plus = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>';

function clashesOf(list){
  const set = new Set();
  const mine = list.filter(e => state.picks.has(e.id));
  for (let i=0;i<mine.length;i++) for (let j=i+1;j<mine.length;j++)
    if (mine[i].start < mine[j].end && mine[j].start < mine[i].end) { set.add(mine[i].id); set.add(mine[j].id); }
  return set;
}

function blocks(list, clash){
  const bySlot = new Map();
  for (const e of list) { if (!bySlot.has(e.start)) bySlot.set(e.start, []); bySlot.get(e.start).push(e); }
  return `<div class="list">` + [...bySlot.entries()].map(([t, evs]) => `
    <div class="slot"><div class="t">${fmt(t)}</div><div class="cards">${evs.map(e => {
      const on = state.picks.has(e.id);
      return `<div class="card ${on?"on":""}" style="--v:var(${VENUES[e.venue].c})" data-id="${esc(e.id)}" role="button" tabindex="0">
        <div class="when"><i></i>${fmt(e.start)}–${e.noEnd?"?":fmt(e.end)} · ${esc(e.tag)}${clash.has(e.id)?'<span class="clash">clash</span>':""}</div>
        <div class="ttl">${esc(e.sub && e.tag!=="PARTY" && e.title.length<40 && !/·/.test(e.title) ? e.title+" — "+e.sub : e.title)}</div>
        <div class="where">${esc(e.loc)}</div>
        ${e.fixed ? `<button class="pick" disabled aria-label="Fixed in my picks">${check}</button>`
          : `<button class="pick" data-pick="${esc(e.id)}" aria-label="${on?"Remove from":"Add to"} my picks">${on?check:plus}</button>`}
      </div>`; }).join("")}</div></div>`).join("") + `</div>`;
}

function scaled(list, dayId){
  const t0 = Math.floor(Math.min(...list.map(e=>e.start))/30)*30;
  const t1 = Math.ceil(Math.max(...list.map(e=>e.end))/30)*30;
  const ppm = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--ppm")) || 2.4;
  // column layout: group overlapping events into clusters, assign columns greedily
  const evs = [...list].sort((a,b)=>a.start-b.start || b.end-a.end);
  const placed = []; let cluster = []; let clusterEnd = -1;
  const flush = () => { const cols = []; for (const e of cluster){ let c = cols.findIndex(end => end <= e.start); if (c<0){ c = cols.length; cols.push(0);} cols[c] = e.end; e._col = c; } for (const e of cluster) e._n = cols.length; placed.push(...cluster); cluster = []; };
  for (const e of evs){ if (e.start >= clusterEnd && cluster.length) flush(); cluster.push(e); clusterEnd = Math.max(clusterEnd, e.end); }
  if (cluster.length) flush();
  let html = `<div class="tl" style="height:${(t1-t0)*ppm}px">`;
  for (let t = Math.ceil(t0/60)*60; t <= t1; t += 60) html += `<div class="hr" style="top:${(t-t0)*ppm}px"><span>${fmt(t)}</span></div>`;
  for (const e of placed){
    const on = state.picks.has(e.id); const h = (e.end-e.start)*ppm - 2;
    const w = 100/e._n;
    html += `<button class="ev ${on?"on":""} ${h<34?"tiny":""}" data-id="${esc(e.id)}" style="--v:var(${VENUES[e.venue].c});top:${(e.start-t0)*ppm}px;height:${h}px;left:calc(${w*e._col}% + 1px);width:calc(${w}% - 2px)" aria-label="${esc(e.title)}, ${fmt(e.start)}">
      <div class="when">${fmt(e.start)}–${e.noEnd?"?":fmt(e.end)}</div><div class="ttl">${esc(e.title)}</div></button>`;
  }
  // now line
  const now = new Date(); const local = new Date(now.toLocaleString("en-US",{timeZone:"Europe/Brussels"}));
  const ymd = local.getFullYear()+"-"+String(local.getMonth()+1).padStart(2,"0")+"-"+String(local.getDate()).padStart(2,"0");
  let nm = local.getHours()*60+local.getMinutes();
  const prev = new Date(local); prev.setDate(prev.getDate()-1);
  const ymdPrev = prev.getFullYear()+"-"+String(prev.getMonth()+1).padStart(2,"0")+"-"+String(prev.getDate()).padStart(2,"0");
  if (ymdPrev === dayId && nm + 1440 <= t1) nm += 1440; else if (ymd !== dayId) nm = -1;
  if (nm >= t0 && nm <= t1) html += `<div class="now" style="top:${(nm-t0)*ppm}px"><span>now</span></div>`;
  return html + `</div>`;
}

function render(){
  $("v-all").setAttribute("aria-pressed", state.view==="all");
  $("v-mine").setAttribute("aria-pressed", state.view==="mine");
  $("s-blocks").setAttribute("aria-pressed", state.scale==="blocks");
  $("s-scale").setAttribute("aria-pressed", state.scale==="scale");
  $("cnt").textContent = state.picks.size;
  let out = "";
  for (const d of DAYS){
    const all = EVENTS.filter(e => e.day===d.id).sort((a,b)=>a.start-b.start || a.venue.localeCompare(b.venue));
    const list = state.view==="mine" ? all.filter(e=>state.picks.has(e.id)) : all;
    const clash = clashesOf(all);
    const span = list.length ? `${fmt(Math.min(...list.map(e=>e.start)))}–${fmt(Math.max(...list.map(e=>e.end)))} · ${list.length} event${list.length>1?"s":""}` : "";
    out += `<section class="day" id="d-${d.id}"><div class="dayhead"><h2>${d.dow} ${d.n}</h2><span class="meta">${span}</span></div>`;
    if (!list.length) out += `<div class="empty">${state.view==="mine" ? "No picks for this day yet. Switch to Full agenda and tap + on the events you want to join." : "Nothing listed for this day yet."}</div>`;
    else out += state.scale==="blocks" ? blocks(list, clash) : scaled(list, d.id);
    out += `</section>`;
  }
  $("main").innerHTML = out;
  document.documentElement.style.setProperty("--hdr", ($("hdr").offsetHeight + 4) + "px");
  syncDay();
}

// Highlight the day tab for the section currently under the sticky header
function syncDay(){
  const line = $("hdr").getBoundingClientRect().bottom + 8;
  let cur = DAYS[0].id;
  for (const d of DAYS) { const s = $("d-"+d.id); if (s && s.getBoundingClientRect().top <= line) cur = d.id; }
  if (innerHeight + scrollY >= document.documentElement.scrollHeight - 2) cur = DAYS[DAYS.length-1].id;
  for (const b of $("daynav").children) b.setAttribute("aria-current", b.dataset.day===cur);
}
let dayTick = false;
addEventListener("scroll", () => { if (!dayTick) { dayTick = true; requestAnimationFrame(() => { dayTick = false; syncDay(); }); } }, {passive:true});
addEventListener("resize", syncDay);

function togglePick(id){ if (isFixed(id)) return; state.picks.has(id) ? state.picks.delete(id) : state.picks.add(id); save(); render(); }

function openSheet(id){
  const e = EVENTS.find(x=>x.id===id); if (!e) return;
  const d = DAYS.find(x=>x.id===e.day);
  const on = state.picks.has(id);
  const subParts = e.sub ? e.sub.split(" | ") : [];
  $("sheetRoot").innerHTML = `<div class="scrim" id="scrim"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(e.title)}" style="--v:var(${VENUES[e.venue].c})"><div class="inner">
    <span class="tag">${esc(e.tag)}</span>
    <h3>${esc(e.title)}</h3>
    ${subParts.map(p=>`<div class="sub">${esc(p)}</div>`).join("")}
    <div class="row">${d.dow} ${d.n} Oct · ${fmt(e.start)}–${e.noEnd?"end not listed":fmt(e.end)} · ${e.end-e.start} min${e.noEnd?" (assumed)":""}</div>
    <div class="row">${esc(e.loc)}</div>
    <div class="actions">
      <button class="btn-pick ${on?"on":""}" id="sheetPick" ${e.fixed?"disabled":""}>${e.fixed?"Fixed in my picks":on?"Remove from my picks":"Add to my picks"}</button>
      <a class="btn-link" href="${esc(e.url)}" target="_blank" rel="noopener">${e.urlLabel || "Event page ↗"}</a>
    </div>
  </div></div>`;
  $("scrim").onclick = closeSheet;
  $("sheetPick").onclick = () => { togglePick(id); closeSheet(); };
  $("sheetPick").focus();
}
function closeSheet(){ $("sheetRoot").innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key==="Escape") closeSheet(); if ((e.key==="Enter"||e.key===" ") && e.target.classList?.contains("card")) { e.preventDefault(); openSheet(e.target.dataset.id); } });

$("main").addEventListener("click", ev => {
  const p = ev.target.closest("[data-pick]"); if (p){ ev.stopPropagation(); togglePick(p.dataset.pick); return; }
  const c = ev.target.closest("[data-id]"); if (c) openSheet(c.dataset.id);
});
$("v-all").onclick = () => { state.view="all"; save(); render(); };
$("v-mine").onclick = () => { state.view="mine"; save(); render(); };
$("s-blocks").onclick = () => { state.scale="blocks"; save(); render(); };
$("s-scale").onclick = () => { state.scale="scale"; save(); render(); };

// Favicon: white K on black, drawn in the display font once it has loaded (the SVG in <head> is the fallback)
document.fonts.load('800 54px "Bricolage Grotesque"', "K").then(faces => {
  if (!faces.length) return;
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const x = c.getContext("2d");
  x.fillStyle = "#000"; x.fillRect(0, 0, 64, 64);
  x.fillStyle = "#fff"; x.font = '800 54px "Bricolage Grotesque"'; x.textAlign = "center"; x.textBaseline = "alphabetic";
  const m = x.measureText("K");
  x.fillText("K", 32, 32 + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2);
  $("favicon").href = c.toDataURL("image/png");
}).catch(() => {});
